name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motor:
    name: motor agronômico e laudo PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # só os pacotes: o typecheck lê os tipos de agro-core/dist. O app web tem o job próprio abaixo;
      # buildá-lo aqui também dependia de baixar fontes do Google (flaky) e dobrava o tempo.
      - run: npm run build --workspace @agrotech/agro-core --workspace @agrotech/laudo-pdf
      - run: npm run typecheck
      - run: npm test

  web:
    name: build do app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @agrotech/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-build
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  rls:
    name: políticas RLS (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop

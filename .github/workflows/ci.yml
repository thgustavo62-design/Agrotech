name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motor:
    name: motor agronômico e laudo PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # só os pacotes: o typecheck lê os tipos de agro-core/dist. O app web tem o job próprio abaixo;
      # buildá-lo aqui também dependia de baixar fontes do Google (flaky) e dobrava o tempo.
      - run: npm run build --workspace @agrotech/agro-core --workspace @agrotech/laudo-pdf
      - run: npm run typecheck
      - run: npm test

  web:
    name: build do app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @agrotech/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-build
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      # O OCR de laudo escaneado roda num worker que carrega WASM e dependências por caminho dinâmico: se o rastreamento do
      # Next não os incluir, o deploy 'funciona' mas o documento fica preso em 'lendo…'. Este passo copia SÓ o que o build
      # rastreou para uma pasta isolada e roda o OCR lá (Linux = mesmo sistema do Vercel).
      - name: OCR — o pacote publicado faz OCR sozinho
        run: node e2e/verificar-pacote-ocr.mjs
        working-directory: apps/web
      - name: OCR — leitura de um PDF escaneado de ponta a ponta
        run: npx vitest run lib/ocr-pdf.test.ts
        working-directory: apps/web
        env:
          OCR_SMOKE: '1'

  navegador:
    name: telas em navegador real (simulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # build apontando para o Supabase SIMULADO (e2e/supabase-simulado.mjs): nada daqui toca o banco real
      - run: npm run build --workspace @agrotech/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: x
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3111
          SUPABASE_SERVICE_ROLE_KEY: chave-de-teste
      - run: npm run e2e --workspace @agrotech/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: x
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3111
          SUPABASE_SERVICE_ROLE_KEY: chave-de-teste

  rls:
    name: políticas RLS (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop

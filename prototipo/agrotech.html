<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgroTech de Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --papel:#EEF1EC;
  --papel-2:#FFFFFF;
  --papel-3:#F7F9F5;
  --tinta:#111A14;
  --grafite:#59635C;
  --grafite-2:#8B948C;
  --linha:#DCE1D8;
  --linha-forte:#C4CCBF;
  --folha:#0F5C43;
  --folha-clara:#E2EFE7;
  --calcario:#F6F1E4;

  /* escala de interpretacao - derivada da fita de pH */
  --c-mb:#B4342A;
  --c-b:#D9762A;
  --c-m:#DFA92A;
  --c-bom:#4B963E;
  --c-mbom:#1B7355;

  --ca:#2E7D5B; --mg:#7FA83B; --k:#DFA92A; --na:#9AA0A6; --al:#B4342A; --hal:#6B5B4B;

  --r:14px;
  --r-p:9px;
  --r-mini:6px;
  --folha-escura:#0b4834;
  --sombra:0 1px 2px rgba(17,26,20,.04), 0 10px 28px -20px rgba(17,26,20,.42);
  --sombra-alta:0 2px 4px rgba(17,26,20,.05), 0 22px 44px -26px rgba(17,26,20,.52);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:'Archivo',system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.025em;line-height:1.12}
h1{font-size:28px}
h2{font-size:19px}
h3{font-size:15px}
a{color:var(--folha)}
button{font-family:inherit}
::selection{background:var(--folha);color:#fff}

/* ---------- estrutura ---------- */
.topo{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#152019 0%,#111A14 100%);
  color:#EAEFE9;
  display:flex;align-items:center;gap:14px;
  padding:11px 20px;
  border-bottom:1px solid #0a110c;
}
.marca{display:flex;align-items:baseline;gap:9px;font-weight:800;letter-spacing:-.035em;font-size:19px}
.marca::before{
  content:"";width:9px;height:9px;border-radius:2px;background:#4FB286;
  transform:rotate(45deg);margin-right:1px
}
.marca span{color:#7FC6A3;font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.topo .quem{margin-left:auto;text-align:right;font-size:11.5px;color:#98A39B;line-height:1.35}
.topo .quem b{display:block;color:#EAEFE9;font-size:13px;font-weight:600}

.abas{
  position:sticky;top:45px;z-index:35;
  background:rgba(238,241,236,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--linha);
  display:flex;gap:4px;padding:8px 14px;overflow-x:auto;scrollbar-width:none;
}
.abas::-webkit-scrollbar{display:none}
.aba{
  border:1px solid transparent;background:none;padding:7px 13px;cursor:pointer;border-radius:99px;
  font-size:13px;font-weight:600;color:var(--grafite);white-space:nowrap;
  transition:background .15s ease,color .15s ease;
}
.aba:hover{color:var(--tinta);background:rgba(17,26,20,.05)}
.aba[aria-current="true"]{color:#fff;background:var(--folha);border-color:var(--folha)}
main{max-width:1100px;margin:0 auto;padding:26px 18px 90px}

.cabecalho-vista{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.cabecalho-vista p{margin:5px 0 0;color:var(--grafite);font-size:13.5px;max-width:60ch}
.cabecalho-vista .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.olho{
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--folha);
  font-weight:700;display:block;margin-bottom:5px
}

/* ---------- componentes ---------- */
.cartao{background:var(--papel-2);border:1px solid var(--linha);border-radius:var(--r);padding:18px;box-shadow:var(--sombra)}
.cartao+.cartao{margin-top:14px}
.grade{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}

label{display:block;font-size:11px;font-weight:700;color:var(--grafite);margin-bottom:5px;letter-spacing:.02em}
label .un{font-weight:400;text-transform:none;letter-spacing:0;color:var(--grafite-2)}
input,select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--linha-forte);border-radius:var(--r-p);
  background:#fff;color:var(--tinta);font-family:inherit;font-size:14px;
}
input.mono,td input{font-family:'IBM Plex Mono',monospace}
input:focus,select:focus,textarea:focus{outline:2px solid var(--folha);outline-offset:1px;border-color:var(--folha)}
input::placeholder{color:var(--grafite-2)}
textarea{min-height:82px;resize:vertical}

.btn{
  border:1px solid var(--tinta);background:var(--tinta);color:#fff;
  padding:9px 15px;border-radius:var(--r-p);font-size:13px;font-weight:600;cursor:pointer;
}
.btn:hover{background:#000}
.btn.sec{background:#fff;color:var(--tinta);border-color:var(--linha-forte)}
.btn.sec:hover{border-color:var(--tinta)}
.btn.verde{background:var(--folha);border-color:var(--folha)}
.btn.verde:hover{background:var(--folha-escura)}
.btn.mini{padding:5px 10px;font-size:12px;border-radius:var(--r-mini)}
.btn.perigo{color:var(--c-mb);border-color:var(--linha-forte);background:#fff}
.btn.perigo:hover{border-color:var(--c-mb);background:#FDF3F2}
.btn:focus-visible,.aba:focus-visible{outline:2px solid var(--folha);outline-offset:2px}

.lista{display:flex;flex-direction:column;gap:8px}
.item{
  display:flex;align-items:center;gap:12px;background:var(--papel-2);
  border:1px solid var(--linha);border-radius:var(--r);padding:13px 15px;
}
.item:hover{border-color:var(--linha-forte)}
.item .cresce{flex:1;min-width:0}
.item h3{font-size:14.5px}
.item small{color:var(--grafite);font-size:12px}
.vazio{
  border:1px dashed var(--linha-forte);border-radius:var(--r);padding:32px 22px;text-align:center;
  color:var(--grafite);font-size:13.5px;background:var(--papel-3)
}
.vazio b{display:block;color:var(--tinta);font-size:15.5px;margin-bottom:5px}

.tag{
  display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;
  background:var(--folha-clara);color:var(--folha);white-space:nowrap;letter-spacing:.01em
}
.tag.cinza{background:#EAEDE7;color:var(--grafite)}
.tag.alerta{background:#FBEEDF;color:#8F5410}
.tag.ruim{background:#FAE6E3;color:#8E2419}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grafite);padding:8px;border-bottom:1px solid var(--linha-forte);font-weight:700}
td{padding:8px;border-bottom:1px solid var(--linha)}
tbody tr:hover td,table tr:hover td{background:var(--papel-3)}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace}
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- regua de interpretacao (elemento-assinatura) ---------- */
.regua-linha{display:grid;grid-template-columns:160px 72px 1fr;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--linha)}
.regua-linha:last-child{border-bottom:0}
.regua-nome{font-size:13px;font-weight:600;line-height:1.25}
.regua-nome small{display:block;font-weight:400;color:var(--grafite-2);font-size:11px;font-family:'IBM Plex Mono',monospace}
.regua-valor{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;text-align:right}
.regua{position:relative;height:30px}
.faixas{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:7px;gap:2px}
.faixas i{flex:1;border-radius:2px}
.faixas i:first-child{border-radius:99px 2px 2px 99px}
.faixas i:last-child{border-radius:2px 99px 99px 2px}
.marca-valor{
  position:absolute;top:1px;width:2px;height:22px;background:var(--tinta);
  transform:translateX(-1px);border-radius:2px
}
.marca-valor::after{
  content:"";position:absolute;top:-2px;left:-3.5px;width:9px;height:9px;
  background:var(--tinta);border-radius:99px;border:2px solid var(--papel-2)
}
.regua-classe{font-size:11px;font-weight:700;letter-spacing:.02em}
@media(max-width:640px){
  .regua-linha{grid-template-columns:1fr 76px;grid-template-areas:"nome valor" "regua regua";gap:6px 10px}
  .regua-nome{grid-area:nome}.regua-valor{grid-area:valor}.regua{grid-area:regua}
}

/* ---------- perfil da CTC ---------- */
.perfil{display:flex;height:52px;border-radius:var(--r-p);overflow:hidden;border:1px solid var(--linha-forte)}
.perfil div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:700;font-family:'IBM Plex Mono',monospace;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.legenda{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:11.5px;color:var(--grafite)}
.legenda span{display:flex;align-items:center;gap:6px}
.legenda i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}

.metrica{background:var(--papel-2);border:1px solid var(--linha);border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
.metrica::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--folha);opacity:.5}
.metrica b{display:block;font-family:'IBM Plex Mono',monospace;font-size:25px;font-weight:600;letter-spacing:-.03em;margin:3px 0 1px}
.metrica span{font-size:10px;color:var(--grafite);text-transform:uppercase;letter-spacing:.11em;font-weight:700}
.metrica em{font-style:normal;font-size:12px;color:var(--grafite-2)}

.aviso{
  border:1px solid #E8D9B0;border-left:3px solid #C79A28;background:#FCF7EA;padding:12px 14px;
  border-radius:0 var(--r-p) var(--r-p) 0;font-size:12.5px;color:#5A4614;line-height:1.5
}
.nota{font-size:12px;color:var(--grafite-2);line-height:1.45}

/* ---------- modal ---------- */
.fundo{position:fixed;inset:0;background:rgba(17,26,20,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0}
@media(min-width:640px){.fundo{align-items:center;padding:26px}}
.modal{
  background:var(--papel);width:100%;max-width:760px;max-height:92vh;overflow:auto;
  border-radius:18px 18px 0 0;padding:20px;box-shadow:var(--sombra-alta)
}
@media(min-width:640px){.modal{border-radius:var(--r)}}
.modal.estreito{max-width:420px}
.modal-topo{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-topo .btn{margin-left:auto}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--tinta);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:500;
  z-index:80;box-shadow:0 14px 34px -12px rgba(0,0,0,.55)
}

/* ---------- resultados do produtor (visão "bruta") ---------- */
.bruto{max-width:680px;margin:0 auto}
.bruto .cabeca{border-bottom:3px solid var(--tinta);padding-bottom:12px;margin-bottom:6px}
.bruto .cabeca .selo{font:700 11px/1 'IBM Plex Mono',monospace;letter-spacing:.28em;color:var(--folha)}
.bruto .cabeca h1{font-size:25px;margin:6px 0 2px}
.bruto .cabeca .sub{font-size:12.5px;color:var(--grafite);margin:0}
.bruto h2{font-size:15px;margin:24px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--linha-forte)}
.bruto .talhao{border:1px solid var(--linha);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.bruto .talhao .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.bruto .talhao .top b{font-size:15px}
.bruto .talhao .top span{font-size:12px;color:var(--grafite)}
.bruto .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.bruto .num{border-left:3px solid var(--linha-forte);padding-left:8px}
.bruto .num span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--grafite)}
.bruto .num b{display:block;font:700 24px/1.1 'IBM Plex Mono',monospace;margin:3px 0 1px}
.bruto .num em{font-style:normal;font-size:11px;color:var(--grafite-2)}
.bruto .num.bom{border-left-color:var(--c-mbom)} .bruto .num.bom b{color:var(--c-mbom)}
.bruto .num.ruim{border-left-color:var(--c-mb)} .bruto .num.ruim b{color:var(--c-mb)}
.bruto ul.acoes{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.7}
.bruto ul.acoes .alerta{color:var(--c-mb)}
.bruto .rodape{margin-top:24px;padding-top:12px;border-top:1px solid var(--linha-forte);font-size:11.5px;color:var(--grafite-2)}
@media(max-width:520px){.bruto .nums{grid-template-columns:1fr}}

/* ---------- laudo ---------- */
.folha-a4{background:#fff;border:1px solid var(--linha);border-radius:var(--r);padding:34px;max-width:840px;margin:0 auto}
.folha-a4 h2{border-bottom:2px solid var(--tinta);padding-bottom:6px;margin:24px 0 11px;font-size:16px}
.folha-a4 .cabecalho{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--folha);padding-bottom:13px}
.assina{margin-top:50px;text-align:center;font-size:12.5px}
.assina hr{border:0;border-top:1px solid var(--tinta);width:290px;margin:0 auto 6px}

@page{size:A4;margin:16mm 14mm}
@media print{
  .topo,.abas,.cabecalho-vista .acoes,.nao-imprime{display:none!important}
  body{background:#fff;font-size:11pt}
  main{padding:0;max-width:none}
  .folha-a4{border:0;padding:0;max-width:none;box-shadow:none}
  .cartao,table,.regua-linha{break-inside:avoid}
  a[href]::after{content:""}
}
@media (prefers-reduced-motion:no-preference){
  .item,.btn,.aba{transition:border-color .15s ease,background .15s ease,color .15s ease}
  .modal{animation:sobe .18s ease-out}
  @keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
</style>

<header class="topo">
  <div class="marca">AgroTech <span>Assistência técnica</span></div>
  <div class="quem" id="quem"></div>
</header>

<nav class="abas" id="abas"></nav>
<main id="vista"></main>
<div id="modal"></div>

<script>
/* ============================================================
   AgroTech — módulo de campo do agrônomo
   Armazenamento: window.storage (artifact) com queda para localStorage
   ============================================================ */

const Store = {
  chave:'agrotech.v1',
  async ler(){
    try{ if(window.storage){ const r = await window.storage.get(this.chave); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const v = localStorage.getItem(this.chave); if(v) return JSON.parse(v); }catch(e){}
    return null;
  },
  async gravar(d){
    const s = JSON.stringify(d);
    try{ if(window.storage){ await window.storage.set(this.chave,s); return; } }catch(e){}
    try{ localStorage.setItem(this.chave,s); }catch(e){}
  }
};

const id = () => (crypto.randomUUID ? crypto.randomUUID() : 'x'+Date.now()+Math.random().toString(16).slice(2));
const n = v => { const x = parseFloat(String(v).replace(',','.')); return isFinite(x)?x:0; };
const f = (v,c=1) => (isFinite(v)?v:0).toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c});
const hoje = () => new Date().toISOString().slice(0,10);
const dataBR = s => s ? s.split('-').reverse().join('/') : '—';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* faixas fisicamente plausíveis — auditoria A7 (rejeita pH 42, argila 300%, etc.) */
const SANIDADE = {
  argila:[0,100], pH:[3,9], MO:[0,100], P:[0,500], K:[0,2000], Na:[0,2000],
  Ca:[0,30], Mg:[0,30], Al:[0,30], HAl:[0,50], S:[0,500],
  B:[0,20], Zn:[0,100], Cu:[0,100], Mn:[0,500], Fe:[0,1000], prnt:[1,150]
};
function valoresImplausiveis(d){
  const ruins=[];
  for(const k in SANIDADE){
    const raw=d[k];
    if(raw===''||raw==null) continue;
    const [lo,hi]=SANIDADE[k], x=n(raw);
    if(x<lo||x>hi) ruins.push(k);
  }
  return ruins;
}

/* ============================================================
   TABELAS DE REFERÊNCIA (editáveis na aba Tabelas)
   Base: Alvarez V. et al. — 5ª Aproximação/MG, com ajustes para
   as culturas do Espírito Santo. Calibre com a sua base regional.
   ============================================================ */

const PADRAO = {
  // faixas: 4 quebras => 5 classes
  faixas:{
    pH:      {rot:'pH em água',      un:'',            q:[4.5,5.4,6.0,7.0], nomes:['Ac. muito elevada','Ac. elevada','Ac. média','Adequado','Alcalino'], cores:['mb','b','m','mbom','m']},
    MO:      {rot:'Matéria orgânica',un:'dag/kg',      q:[0.7,2.0,4.0,7.0]},
    P:       {rot:'Fósforo (Mehlich-1)',un:'mg/dm³',   q:null},         // depende da argila
    K:       {rot:'Potássio',        un:'mg/dm³',      q:[15,40,70,120]},
    Ca:      {rot:'Cálcio',          un:'cmolc/dm³',   q:[0.4,1.2,2.4,4.0]},
    Mg:      {rot:'Magnésio',        un:'cmolc/dm³',   q:[0.15,0.45,0.90,1.50]},
    Al:      {rot:'Alumínio trocável',un:'cmolc/dm³',  q:[0.2,0.5,1.0,2.0], inv:true},
    HAl:     {rot:'Acidez potencial (H+Al)',un:'cmolc/dm³',q:[1.0,2.5,5.0,9.0], inv:true},
    S:       {rot:'Enxofre',         un:'mg/dm³',      q:[2.5,5.0,10.0,15.0]},
    B:       {rot:'Boro',            un:'mg/dm³',      q:[0.15,0.35,0.60,0.90]},
    Zn:      {rot:'Zinco',           un:'mg/dm³',      q:[0.4,0.9,1.5,2.2]},
    Cu:      {rot:'Cobre',           un:'mg/dm³',      q:[0.3,0.7,1.2,1.8]},
    Mn:      {rot:'Manganês',        un:'mg/dm³',      q:[2,5,8,12]},
    Fe:      {rot:'Ferro',           un:'mg/dm³',      q:[8,18,30,45]},
    SB:      {rot:'Soma de bases',   un:'cmolc/dm³',   q:[0.6,1.8,3.6,6.0]},
    t:       {rot:'CTC efetiva (t)', un:'cmolc/dm³',   q:[0.8,2.3,4.6,8.0]},
    T:       {rot:'CTC a pH 7 (T)',  un:'cmolc/dm³',   q:[1.6,4.3,8.6,15.0]},
    V:       {rot:'Saturação por bases (V)',un:'%',    q:[20,40,60,80]},
    m:       {rot:'Saturação por alumínio (m)',un:'%', q:[15,30,50,75], inv:true}
  },
  // fósforo por classe de argila
  fosforo:[
    {argila:'60–100%', min:60, q:[2.7,5.4,8.0,12.0]},
    {argila:'35–60%',  min:35, q:[4.0,8.0,12.0,18.0]},
    {argila:'15–35%',  min:15, q:[6.6,12.0,20.0,30.0]},
    {argila:'0–15%',   min:0,  q:[10.0,20.0,30.0,45.0]}
  ],
  culturas:{
    'cafe-conilon':{nome:'Café conilon – produção', un:'sc/ha (60 kg benef.)', ref:60, V2:60, m_max:20,
      N:350, P:[80,60,45,30,20], K:[320,280,240,180,120],
      parc:['Set–out (após 1ª chuva) – 30% N, todo o P, 30% K','Nov–dez – 40% N, 40% K','Jan–fev – 30% N, 30% K'],
      obs:'Conilon responde bem a K; manter relação K/Mg equilibrada. Boro em cobertura ou foliar na florada.'},
    'cafe-arabica':{nome:'Café arábica – produção', un:'sc/ha (60 kg benef.)', ref:30, V2:60, m_max:20,

   ============================================================ */

function classificar(v, quebras){
  if(!quebras) return 0;
  let i=0; while(i<quebras.length && v>quebras[i]) i++;
  return i; // 0..4
}
const NOMES_CLASSE = ['Muito baixo','Baixo','Médio','Bom','Muito bom'];
const NOMES_INV    = ['Muito baixo','Baixo','Médio','Alto','Muito alto'];
const CORES = ['var(--c-mb)','var(--c-b)','var(--c-m)','var(--c-bom)','var(--c-mbom)'];
const CORES_INV = ['var(--c-mbom)','var(--c-bom)','var(--c-m)','var(--c-b)','var(--c-mb)'];

function faixaP(argila){
  const t = S.tab.fosforo.find(x => argila >= x.min) || S.tab.fosforo[S.tab.fosforo.length-1];
  return t;
}

function calcular(a){
  const Kc = n(a.K)/391;                       // K de mg/dm³ para cmolc/dm³
  const Na = n(a.Na)/230;
  const SB = n(a.Ca)+n(a.Mg)+Kc+Na;
  const t  = SB + n(a.Al);
  const T  = SB + n(a.HAl);
  const V  = T>0 ? 100*SB/T : 0;
  const m  = t>0 ? 100*n(a.Al)/t : 0;
  const r  = {
    Kc, SB, t, T, V, m,
    CaMg: n(a.Mg)>0 ? n(a.Ca)/n(a.Mg) : 0,
    CaK:  Kc>0 ? n(a.Ca)/Kc : 0,
    MgK:  Kc>0 ? n(a.Mg)/Kc : 0,
    partCa: T>0 ? 100*n(a.Ca)/T : 0,
    partMg: T>0 ? 100*n(a.Mg)/T : 0,
    partK:  T>0 ? 100*Kc/T : 0,
    faixaP: faixaP(n(a.argila))
  };
  r.classeP = classificar(n(a.P), r.faixaP.q);
  r.classeK = classificar(n(a.K), S.tab.faixas.K.q);
  return r;
}

function calagem(a, r, cult, prnt, prof){
  const V2 = cult ? cult.V2 : 60;
  const fatorProf = prof===40 ? 2 : prof===30 ? 1.5 : 1;
  const nc_sb = Math.max(0, (V2 - r.V) * r.T / 100);
  // método alumínio + cálcio e magnésio
  const argila = n(a.argila);
  const Y = argila>=60?4 : argila>=35?3 : argila>=15?2 : 1;
  const mMax = cult ? cult.m_max : 20;
  const nc_al = Math.max(0, Y*(n(a.Al) - (mMax*r.t/100))) + Math.max(0, 2 - (n(a.Ca)+n(a.Mg)));
  const escolhido = Math.max(nc_sb, nc_al);
  const corrigido = prnt>0 ? escolhido * (100/prnt) * fatorProf : 0;
  return {V2, nc_sb, nc_al, Y, escolhido, corrigido, fatorProf};
}

function gessagem(a, r){
  const argila = n(a.argila);
  const precisa = n(a.Al) > 0.5 || n(a.Ca) < 0.5 || r.m > 20;
  return { precisa, dose: 50*argila, criterio: precisa
    ? 'Indicado: há alumínio ou baixo Ca no perfil. Confirme com análise de subsuperfície (20–40 cm).'
    : 'Não indicado pela camada 0–20 cm. Só avalie gesso com análise de 20–40 cm mostrando Ca < 0,5 ou m > 20%.' };
}

function adubacao(a, r, cult, prod){
  if(!cult) return null;
  const fator = cult.ref>0 && prod>0 ? prod/cult.ref : 1;
  const N   = Math.round(cult.N * fator);
  const P2O5= Math.round(cult.P[r.classeP] * fator);
  const K2O = Math.round(cult.K[r.classeK] * fator);
  return {N, P2O5, K2O, fator};
}

function diagnostico(a, r, cult){
  const d = [];
  const push = (g,txt) => d.push({g,txt});
  if(n(a.pH) < 5.0) push('crit','pH abaixo de 5,0 – acidez elevada limita a absorção de P, Ca, Mg e a atividade microbiana.');
  else if(n(a.pH) > 6.8) push('atencao','pH acima de 6,8 – risco de indisponibilizar Zn, Mn, Fe e B.');
  if(r.m > (cult?cult.m_max:20)) push('crit','Saturação por alumínio de '+f(r.m,0)+'% acima do limite da cultura – o alumínio está podando o sistema radicular.');
  if(r.V < (cult?cult.V2:60)-10) push('crit','Saturação por bases em '+f(r.V,0)+'%, contra os '+(cult?cult.V2:60)+'% desejados. Calagem é a primeira intervenção.');
  if(r.classeP <= 1) push('crit','Fósforo '+NOMES_CLASSE[r.classeP].toLowerCase()+' para solo com '+f(n(a.argila),0)+'% de argila – resposta esperada à adubação fosfatada é alta.');
  if(r.classeK <= 1) push('atencao','Potássio '+NOMES_CLASSE[r.classeK].toLowerCase()+' – priorize o parcelamento para reduzir perda por lixiviação.');
  if(n(a.MO) < 2) push('atencao','Matéria orgânica baixa ('+f(n(a.MO),1)+' dag/kg) – avaliar adubação orgânica, cobertura morta ou braquiária na entrelinha.');
  if(r.CaMg > 0 && (r.CaMg < 2 || r.CaMg > 5)) push('atencao','Relação Ca/Mg em '+f(r.CaMg,1)+':1, fora da faixa de 2:1 a 5:1 – escolha o corretivo (calcário calcítico ou dolomítico) por essa relação.');
  if(r.MgK > 0 && r.MgK < 3) push('atencao','Relação Mg/K em '+f(r.MgK,1)+':1 – excesso relativo de K pode induzir deficiência de Mg.');
  if(n(a.B) <= S.tab.faixas.B.q[1]) push('atencao','Boro baixo – corrigir via solo (bórax/ulexita) ou foliar, principalmente em café, mamão e eucalipto.');
  if(n(a.Zn) <= S.tab.faixas.Zn.q[1]) push('atencao','Zinco baixo – aplicar via solo com o formulado ou foliar no crescimento vegetativo.');
  if(n(a.S) <= S.tab.faixas.S.q[1]) push('atencao','Enxofre baixo – preferir superfosfato simples ou sulfato de amônio como fonte.');
  if(!d.length) push('ok','Nenhuma limitação química relevante na camada analisada. Manter a fertilidade com adubação de reposição.');
  return d;
}

const COR_CURTA = {mb:'var(--c-mb)',b:'var(--c-b)',m:'var(--c-m)',bom:'var(--c-bom)',mbom:'var(--c-mbom)'};

function regua(rot, un, valor, quebras, inv, nomesCfg, coresCfg){
  if(!quebras) return '';
  const i = classificar(valor, quebras);
  const nomes = nomesCfg || (inv?NOMES_INV:NOMES_CLASSE);
  const cores = (coresCfg||[]).length===5
    ? coresCfg.map(c => COR_CURTA[c] || c)
    : (inv?CORES_INV:CORES);
  const lo = i===0 ? 0 : quebras[i-1];
  const hi = i===4 ? quebras[3]*1.6 : quebras[i];
  const frac = hi>lo ? Math.min(1,Math.max(0,(valor-lo)/(hi-lo))) : .5;
  const pos = Math.min(99.5, i*20 + frac*20);
  return `<div class="regua-linha">
    <div class="regua-nome">${rot}<small>${un||'&nbsp;'}</small></div>
    <div class="regua-valor">${f(valor, valor<10?2:0)}</div>
    <div class="regua">
      <div class="regua-classe" style="color:${cores[i]}">${nomes[i]}</div>
      <div class="faixas">${cores.map((c,k)=>`<i style="background:${c};opacity:${k===i?1:.28}"></i>`).join('')}</div>
      <div class="marca-valor" style="left:${pos}%"></div>
    </div>
  </div>`;
}

function perfilCTC(a,r){
  const Al=n(a.Al), HAl=n(a.HAl), Ca=n(a.Ca), Mg=n(a.Mg), K=r.Kc;
  const tot = Ca+Mg+K+HAl;
  if(tot<=0) return '';
  const p = v => 100*v/tot;
  const seg = (v,cor) => p(v)<6 ? `<div style="background:${cor};flex:0 0 ${p(v)}%"></div>` : `<div style="background:${cor};flex:0 0 ${p(v)}%">${f(p(v),0)}%</div>`;
  // o Al ja esta contido na acidez potencial (H+Al): mostramos a fracao dentro do proprio segmento
  const fracAl = HAl>0 ? Math.min(100, 100*Al/HAl) : 0;
  const corHAl = `linear-gradient(90deg, var(--al) 0 ${fracAl}%, var(--hal) ${fracAl}% 100%)`;
  return `<div class="perfil">
      ${seg(Ca,'var(--ca)')}${seg(Mg,'var(--mg)')}${seg(K,'var(--k)')}${seg(HAl,corHAl)}
    </div>
    <div class="legenda">
      <span><i style="background:var(--ca)"></i>Ca ${f(p(Ca),0)}% <em class="nota">(ideal 50–60)</em></span>
      <span><i style="background:var(--mg)"></i>Mg ${f(p(Mg),0)}% <em class="nota">(ideal 15–20)</em></span>
      <span><i style="background:var(--k)"></i>K ${f(p(K),1)}% <em class="nota">(ideal 3–5)</em></span>
      <span><i style="background:var(--hal)"></i>H+Al ${f(p(HAl),0)}%</span>
      <span><i style="background:var(--al)"></i>Al ${f(Al,2)} cmolc – m ${f(r.m,0)}% <em class="nota">(parte do H+Al)</em></span>
    </div>`;
}

function toast(msg){
  const d = document.createElement('div');
  d.className='toast'; d.textContent=msg; document.body.appendChild(d);
  setTimeout(()=>d.remove(),2200);
}

/* baixar um arquivo gerado — usa a ponte do artifact quando existe,
   senão o download direto do navegador (arquivo aberto localmente) */
async function baixarArquivo(nome, conteudo, mime){
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      const dl = await window.claude.use('downloads');
      if(dl){ await dl.save({filename:nome, data:conteudo}); return true; }
    }
  }catch(e){ if(e && e.code==='declined') return false; }
  const b = new Blob([conteudo],{type:(mime||'application/octet-stream')+';charset=utf-8'});
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href=u; a.download=nome; a.click();
  URL.revokeObjectURL(u);
  return true;
}

    const fim = v => { const c=document.getElementById('confirmar'); if(c) c.remove(); resolve(v); };

}

function verAnaliseHTML(a){
  const t = S.talhoes.find(x=>x.id===a.talhaoId) || {};
  const cult = S.tab.culturas[t.cultura];
  const r = calcular(a);
  const prod = n(a.prodEsperada) || n(t.prodEsperada) || (cult?cult.ref:0);
  const cal = calagem(a, r, cult, n(a.prnt)||85, parseInt(a.incorp||20));
  const ges = gessagem(a, r);
  const ad = adubacao(a, r, cult, prod);
  const dg = diagnostico(a, r, cult);
  const area = n(t.area)||0;
  const F = S.tab.faixas;

  const fP = r.faixaP;
  const linhas = [
    regua(F.pH.rot, F.pH.un, n(a.pH), F.pH.q, false, F.pH.nomes, F.pH.cores),
    regua(F.MO.rot, F.MO.un, n(a.MO), F.MO.q),
    regua('Fósforo (argila '+fP.argila+')','mg/dm³', n(a.P), fP.q),
    regua(F.K.rot, F.K.un, n(a.K), F.K.q),
    regua(F.Ca.rot, F.Ca.un, n(a.Ca), F.Ca.q),
    regua(F.Mg.rot, F.Mg.un, n(a.Mg), F.Mg.q),
    regua(F.Al.rot, F.Al.un, n(a.Al), F.Al.q, true),
    regua(F.HAl.rot, F.HAl.un, n(a.HAl), F.HAl.q, true),
    regua(F.T.rot, F.T.un, r.T, F.T.q),
    regua(F.V.rot, F.V.un, r.V, F.V.q),
    regua(F.m.rot, F.m.un, r.m, F.m.q, true)
  ].join('');

  const micros = ['S','B','Zn','Cu','Mn','Fe'].map(k=>regua(F[k].rot, F[k].un, n(a[k]), F[k].q)).join('');

  return `
  <div class="cabecalho-vista">
    <div><span class="olho">${esc(nomeProdutor(t.produtorId))} · ${esc(t.nome||'')}</span>
      <h1>Interpretação e recomendação</h1>
      <p>Coleta de ${dataBR(a.data)} · camada ${esc(a.prof||'0–20')} cm · ${esc(cult?cult.nome:'sem cultura')} · ${f(area,1)} ha</p></div>
    <div class="acoes">

function fontesSugeridas(a, ad, area){
  const l = [];
  const S_baixo = n(a.S) <= S.tab.faixas.S.q[1];
  if(ad.P2O5>0){
    if(S_baixo) l.push({nome:'Superfosfato simples (18% P₂O₅)', dose:ad.P2O5/0.18, obs:'traz 16% Ca e 10% S – corrige o enxofre baixo'});
    else l.push({nome:'Superfosfato triplo (41% P₂O₅)', dose:ad.P2O5/0.41, obs:'maior concentração, menor frete'});
  }
  if(ad.K2O>0) l.push({nome:'Cloreto de potássio (60% K₂O)', dose:ad.K2O/0.60, obs:'parcelar; evitar mais de 60 kg/ha de K₂O em contato com a semente ou muda'});
  if(ad.N>0){
    if(S_baixo) l.push({nome:'Sulfato de amônio (20% N)', dose:ad.N/0.20, obs:'fonte de N e S; acidifica o solo, considerar na calagem'});
    else l.push({nome:'Ureia (45% N)', dose:ad.N/0.45, obs:'incorporar ou aplicar antes da chuva para reduzir perda por volatilização'});
  }
  if(n(a.B) <= S.tab.faixas.B.q[1]) l.push({nome:'Ácido bórico (17% B)', dose:2/0.17, obs:'2 kg/ha de B via solo, ou aplicação foliar parcelada'});
  if(n(a.Zn) <= S.tab.faixas.Zn.q[1]) l.push({nome:'Sulfato de zinco (20% Zn)', dose:5/0.20, obs:'5 kg/ha de Zn via solo, junto com o fosfatado'});
  return l;
}

function resumoTalhao(t){
  const as = S.analises.filter(a=>a.talhaoId===t.id).sort((x,y)=>(y.data||'').localeCompare(x.data||''));
  const cult = S.tab.culturas[t.cultura];
  const ultima = as[0];
  if(!ultima) return {talhao:t, cult, ultima:null, situacao:'sem_analise'};
  const r = calcular(ultima);
  const V2 = cult?cult.V2:60, mMax = cult?cult.m_max:20;
  const situacao = (r.V < V2-10 || r.m > mMax) ? 'precisa_correcao'
                 : (r.classeP<=1 ? 'atencao' : 'em_ordem');
  return {talhao:t, cult, ultima, r, V2, mMax, situacao};
}

const SITUACAO = {
  precisa_correcao:['ruim','precisa de correção'],
  atencao:['alerta','fósforo baixo'],
  em_ordem:['','solo em ordem'],
  sem_analise:['cinza','sem análise ainda']
};

    <div class="metrica"><span>Culturas</span><b>${chaves.filter(k=>k!=='—').length}</b></div>
    <div class="metrica"><span>Talhões</span><b>${ts.length}</b><em>${f(areaTotal,1)} ha</em></div>
    <div class="metrica"><span>Análises</span><b>${nAnalises}</b></div>
    <div class="metrica"><span>Pedem correção</span><b style="color:${nCrit?'var(--c-mb)':'inherit'}">${nCrit}</b></div>
  </div>

  ${chaves.length ? chaves.map(k=>{
    const cult = S.tab.culturas[k];
    const linhas = grupos[k].map(resumoTalhao);
    const areaC = grupos[k].reduce((s,t)=>s+n(t.area),0);
    return `<div class="cartao" style="margin-top:14px">
      <span class="olho">Cultura · ${f(areaC,1)} ha em ${grupos[k].length} talhão(ões)</span>
      <h2 style="margin:4px 0 4px">${esc(cult?cult.nome:k)}</h2>
      <div style="display:flex;gap:8px;margin:6px 0 12px">
        <button class="btn sec mini" onclick="app.verComoProdutor('${pid}','${k}')">Resultados desta cultura</button>
        <button class="btn sec mini" onclick="app.exportarResultados('${pid}','${k}')">Exportar só esta cultura</button>
      </div>
      <div class="rolagem"><table>
        <tr><th>Talhão</th><th class="num">Área</th><th class="num">Última coleta</th><th class="num">V%</th><th class="num">m%</th><th></th></tr>
        ${linhas.map(x=>{
          const [tom,txt] = SITUACAO[x.situacao];
          return `<tr>
            <td>${esc(x.talhao.nome)}<br><span class="tag ${tom}" style="margin-top:4px">${txt}</span></td>
            <td class="num">${f(n(x.talhao.area),1)} ha</td>
            <td class="num">${x.ultima?dataBR(x.ultima.data):'—'}</td>
            <td class="num" style="color:${x.r?(x.r.V>=x.V2?'var(--c-mbom)':'var(--c-mb)'):'inherit'}">${x.r?f(x.r.V,0)+'%':'—'}</td>
            <td class="num" style="color:${x.r?(x.r.m<=x.mMax?'var(--c-mbom)':'var(--c-mb)'):'inherit'}">${x.r?f(x.r.m,0)+'%':'—'}</td>
            <td class="num">${x.ultima
              ? `<button class="btn sec mini" onclick="app.verAnalise('${x.ultima.id}')">abrir</button>`
              : `<button class="btn sec mini" onclick="app.novaAnalise()">análise</button>`}</td>
          </tr>`;
        }).join('')}
      </table></div>
    </div>`;
  }).join('') : `<div class="vazio" style="margin-top:14px"><b>Nenhum talhão para este produtor</b>Cadastre na aba Talhões.</div>`}`;
}

/* markup "bruto" — o que o produtor recebe no link de resultados */
function resultadosBrutosHTML(pid, culturaFiltro){
  const p = S.produtores.find(x=>x.id===pid) || {};
  let ts = S.talhoes.filter(t=>t.produtorId===pid);
  if(culturaFiltro) ts = ts.filter(t=>t.cultura===culturaFiltro);
  const grupos = {};
  ts.forEach(t=>{ const k=t.cultura||'—'; (grupos[k]=grupos[k]||[]).push(t); });
  const hora = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  const blocos = Object.keys(grupos).map(k=>{
    const cult = S.tab.culturas[k];
    const cards = grupos[k].map(t=>{
      const x = resumoTalhao(t);
      if(!x.ultima) return `<div class="talhao"><div class="top"><b>${esc(t.nome)}</b><span>sem análise lançada</span></div></div>`;
      const a = x.ultima, r = x.r, area = n(t.area)||0;
      const cal = calagem(a,r,cult,n(a.prnt)||85,parseInt(a.incorp||20));
      const ges = gessagem(a,r);
      const ad = adubacao(a,r,cult, n(a.prodEsperada)||n(t.prodEsperada)||(cult?cult.ref:0));
      const dg = diagnostico(a,r,cult).find(d=>d.g==='crit');
      const corr = (n(a.Mg)<0.9||r.CaMg>4)?'dolomítico':r.CaMg<2?'calcítico':'magnesiano';
      return `<div class="talhao">
        <div class="top"><b>${esc(t.nome)}</b><span>${dataBR(a.data)} · ${esc(a.prof||'0–20')} cm · ${f(area,1)} ha</span></div>
        <div class="nums">
          <div class="num ${r.V>=x.V2?'bom':'ruim'}"><span>Saturação de bases (V)</span><b>${f(r.V,0)}%</b><em>meta ${x.V2}%</em></div>
          <div class="num ${r.m<=x.mMax?'bom':'ruim'}"><span>Saturação de alumínio (m)</span><b>${f(r.m,0)}%</b><em>limite ${x.mMax}%</em></div>
          <div class="num"><span>pH em água</span><b>${f(n(a.pH),1)}</b><em>CTC ${f(r.T,1)}</em></div>
        </div>
        <ul class="acoes">
          <li><b>Calcário:</b> ${f(cal.corrigido,1)} t/ha${area>0?` — ${f(cal.corrigido*area,1)} t no talhão`:''} (${corr})</li>
          ${ges.precisa?`<li><b>Gesso:</b> investigar com análise de 20–40 cm</li>`:''}
          ${ad?`<li><b>Adubação:</b> N ${ad.N} · P₂O₅ ${ad.P2O5} · K₂O ${ad.K2O} kg/ha</li>`:''}
          ${dg?`<li class="alerta"><b>Atenção:</b> ${esc(dg.txt)}</li>`:''}
        </ul>
      </div>`;
    }).join('');
    return `<h2>${esc(cult?cult.nome:k)}</h2>${cards}`;
  }).join('');

  return `<div class="bruto">
    <div class="cabeca">
      <div class="selo">AGROTECH</div>
      <h1>${esc(p.nome||'Produtor')}</h1>
      <p class="sub">${culturaFiltro?esc(nomeCulturaCurto(culturaFiltro)):'lavoura toda'} · atualizado ${hora} de ${dataBR(hoje())}</p>
    </div>
    ${blocos || '<p class="nota">Ainda não há análises lançadas.</p>'}
    <div class="rodape">Gerado pelo AgroTech a partir das análises lançadas pelo seu técnico.
      Recomendação de partida — confirme dose, fonte e época com o responsável técnico antes de aplicar.
      ${esc(S.consultor.nome||'')}${S.consultor.crea?' · CREA '+esc(S.consultor.crea):''}</div>
  </div>`;
}

/* ============================================================
   AÇÕES
   ============================================================ */

const app = {
  ir(k){ atual=k; render(); },
  fecharModal(){ document.getElementById('modal').innerHTML=''; },

  filtrarCultura(k){
    filtroCultura = k;
    document.getElementById('vista').innerHTML = vAnalises();
    window.scrollTo({top:0});
  },

  verProdutor(pid){
    atual='produtores';
    document.getElementById('abas').innerHTML = ABAS.map(([k,r])=>
      `<button class="aba" aria-current="${k===atual}" onclick="app.ir('${k}')">${r}</button>`).join('');
    document.getElementById('vista').innerHTML = vProdutorHTML(pid);
    window.scrollTo({top:0});
  },
  verComoProdutor(pid, cultura){
    const c = cultura||'';
    document.getElementById('vista').innerHTML =
      `<div class="cabecalho-vista nao-imprime"><div><span class="olho">Prévia</span>
         <h1>Como o produtor vê</h1><p>É isto que o produtor recebe no link/arquivo de resultados.</p></div>
       <div class="acoes">
         <button class="btn verde" onclick="app.exportarResultados('${pid}'${c?",'"+c+"'":''})">Exportar como HTML</button>
         <button class="btn sec" onclick="app.verProdutor('${pid}')">Voltar</button></div></div>`
      + resultadosBrutosHTML(pid, c);
    window.scrollTo({top:0});
  },
  async exportarResultados(pid, cultura){
    const p = S.produtores.find(x=>x.id===pid) || {};
    const corpo = resultadosBrutosHTML(pid, cultura||'');
    const estilo = document.querySelector('style').textContent;
    const doc = `<!doctype html><meta charset="utf-8">`
      + `<meta name="viewport" content="width=device-width,initial-scale=1">`
      + `<title>Resultados — ${esc(p.nome||'produtor')}</title><style>${estilo}</style>`
      + `<body style="padding:20px 16px 60px">${corpo}</body>`;
    const nome = (p.nome||'produtor').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
    await baixarArquivo('resultados-'+nome+'-'+hoje()+'.html', doc, 'text/html');
    toast('Arquivo de resultados gerado — envie ao produtor');
  },

  editarProdutor(pid){
    const p = S.produtores.find(x=>x.id===pid) || {nome:'',propriedade:'',municipio:'',fone:'',area:'',obs:''};
    modal(pid?'Editar produtor':'Novo produtor', formProdutor(p),
      `<button class="btn verde" onclick="app.salvarProdutor('${pid||''}')">Salvar</button>
       <button class="btn sec" onclick="app.fecharModal()">Cancelar</button>`);
  },
  async salvarProdutor(pid){
    const v = k => document.getElementById(k).value.trim();
    if(!v('p_nome')) return toast('Informe o nome do produtor');
    const d = {nome:v('p_nome'),propriedade:v('p_prop'),municipio:v('p_mun'),fone:v('p_fone'),area:v('p_area'),obs:v('p_obs')};
    if(pid) Object.assign(S.produtores.find(x=>x.id===pid), d);
    else S.produtores.push({id:id(),...d});
    await salvar(); this.fecharModal(); render(); toast('Produtor salvo');
  },

  editarTalhao(tid){
    if(!S.produtores.length) return toast('Cadastre um produtor primeiro');
    const t = S.talhoes.find(x=>x.id===tid) ||
      {produtorId:S.produtores[0].id,nome:'',cultura:'cafe-conilon',variedade:'',area:'',prodEsperada:'',espacamento:'',ano:'',obs:''};
    modal(tid?'Editar talhão':'Novo talhão', formTalhao(t),
      `<button class="btn verde" onclick="app.salvarTalhao('${tid||''}')">Salvar</button>
       <button class="btn sec" onclick="app.fecharModal()">Cancelar</button>`);
  },
  trocouCultura(){
    const k = document.getElementById('t_cult').value;
    document.getElementById('t_un').textContent = (S.tab.culturas[k]||{}).un||'';
  },
  async salvarTalhao(tid){
    const v = k => document.getElementById(k).value.trim();
    if(!v('t_nome')) return toast('Dê um nome ao talhão');
    const d = {produtorId:v('t_prod'),nome:v('t_nome'),cultura:v('t_cult'),variedade:v('t_var'),
      area:v('t_area'),prodEsperada:v('t_prod_esp'),espacamento:v('t_esp'),ano:v('t_ano'),obs:v('t_obs')};
    if(tid) Object.assign(S.talhoes.find(x=>x.id===tid), d);
    else S.talhoes.push({id:id(),...d});
    await salvar(); this.fecharModal(); render(); toast('Talhão salvo');
  },

  novaAnalise(){ this.editarAnalise(); },
  editarAnalise(aid){
    if(!S.talhoes.length) return toast('Cadastre um talhão primeiro');
    const a = S.analises.find(x=>x.id===aid) || {talhaoId:S.talhoes[0].id,data:hoje(),prof:'0–20',lab:'',prnt:85,incorp:20};
    modal(aid?'Editar análise':'Lançar análise de solo', formAnalise(a),
      `<button class="btn verde" onclick="app.salvarAnalise('${aid||''}')">Interpretar</button>
       <button class="btn sec" onclick="app.fecharModal()">Cancelar</button>`);
  },
  async salvarAnalise(aid){
    const v = k => document.getElementById(k).value.trim();
    const d = {talhaoId:v('a_talhao'),data:v('a_data'),prof:v('a_prof'),lab:v('a_lab'),
      argila:v('a_argila'),pH:v('a_pH'),MO:v('a_MO'),P:v('a_P'),K:v('a_K'),Ca:v('a_Ca'),Mg:v('a_Mg'),
      Al:v('a_Al'),HAl:v('a_HAl'),Na:v('a_Na'),S:v('a_S'),B:v('a_B'),Zn:v('a_Zn'),Cu:v('a_Cu'),
      Mn:v('a_Mn'),Fe:v('a_Fe'),prnt:v('a_prnt'),incorp:v('a_incorp'),prodEsperada:v('a_prod')};
    if(!d.pH || !d.HAl) return toast('pH e H+Al são obrigatórios para calcular a CTC');
    const ruins = valoresImplausiveis(d);
    if(ruins.length) return toast('Valor implausível em: '+ruins.join(', ')+' — confira o laudo.');
    let novoId = aid;
    if(aid) Object.assign(S.analises.find(x=>x.id===aid), d);
    else { novoId = id(); S.analises.push({id:novoId,...d}); }
    await salvar(); this.fecharModal(); this.verAnalise(novoId);
  },
  verAnalise(aid){
    const a = S.analises.find(x=>x.id===aid); if(!a) return;
    atual='analises';
    document.getElementById('abas').innerHTML = ABAS.map(([k,r])=>
      `<button class="aba" aria-current="${k===atual}" onclick="app.ir('${k}')">${r}</button>`).join('');
    document.getElementById('vista').innerHTML = verAnaliseHTML(a);
    window.scrollTo({top:0});
  },
  laudo(aid){
    const a = S.analises.find(x=>x.id===aid); if(!a) return;
    document.getElementById('vista').innerHTML = laudoHTML(a);
    window.scrollTo({top:0});
  },

  novaVisita(vid){
    if(!S.talhoes.length) return toast('Cadastre um talhão primeiro');
    const v = S.visitas.find(x=>x.id===vid) || {talhaoId:S.talhoes[0].id,data:hoje(),fenologia:'',condicao:'Boa',obs:'',recomendacao:'',proxima:'',ocorrencias:[]};
    modal(vid?'Editar visita':'Registrar visita', formVisita(v),
      `<button class="btn verde" onclick="app.salvarVisita('${vid||''}')">Salvar visita</button>
       <button class="btn sec" onclick="app.fecharModal()">Cancelar</button>`);
  },
  trocouTalhaoVisita(){
    // troca so os campos que dependem da cultura; o resto do formulario fica intacto
    const t = S.talhoes.find(x=>x.id===document.getElementById('v_talhao').value) || {};
    const fen = FENOLOGIA[t.cultura] || [];
    document.getElementById('v_fen_wrap').innerHTML =
      `<label>Estádio fenológico</label><select id="v_fen"><option value="">—</option>`+
      fen.map(x=>`<option>${esc(x)}</option>`).join('')+`</select>`;
    const alvos = S.tab.pragas.filter(p=>p.cultura===t.cultura);
    document.getElementById('v_alvos_wrap').innerHTML = alvos.length
      ? `<div class="rolagem"><table><tr><th>Alvo</th><th>Nível de controle</th><th class="num">Incidência aferida</th><th class="num">Acima?</th></tr>`+
        alvos.map((p,i)=>`<tr><td>${esc(p.alvo)}<br><small class="nota">${esc(p.metodo)}</small></td>
          <td class="nota">${esc(p.nivel)}</td>
          <td class="num"><input class="mono" style="width:80px" id="o_${i}" placeholder="%"></td>
          <td class="num"><input type="checkbox" id="ok_${i}" style="width:auto"></td></tr>`).join('')+
        `</table></div>`
      : `<p class="nota">Nenhum alvo cadastrado para esta cultura na aba Tabelas.</p>`;
  },
  async salvarVisita(vid){
    const v = k => { const e=document.getElementById(k); return e?e.value.trim():''; };
    const tid = v('v_talhao');
    const t = S.talhoes.find(x=>x.id===tid)||{};
    const alvos = S.tab.pragas.filter(p=>p.cultura===t.cultura);
    const oc = [];
    alvos.forEach((p,i)=>{
      const val = v('o_'+i);
      const chk = document.getElementById('ok_'+i);
      if(val || (chk&&chk.checked)) oc.push({alvo:p.alvo, valor:val, acima: chk?chk.checked:false});
    });
    const d = {talhaoId:tid,data:v('v_data'),fenologia:v('v_fen'),condicao:v('v_cond'),
      obs:v('v_obs'),recomendacao:v('v_rec'),proxima:v('v_prox'),ocorrencias:oc};
    let novo = vid;
    if(vid) Object.assign(S.visitas.find(x=>x.id===vid), d);
    else { novo = id(); S.visitas.push({id:novo,...d}); }
    await salvar(); this.fecharModal(); this.verVisita(novo);
  },
  verVisita(vid){
    const v = S.visitas.find(x=>x.id===vid); if(!v) return;
    atual='monitoramento';
    document.getElementById('abas').innerHTML = ABAS.map(([k,r])=>
      `<button class="aba" aria-current="${k===atual}" onclick="app.ir('${k}')">${r}</button>`).join('');
    document.getElementById('vista').innerHTML = verVisitaHTML(v);
    window.scrollTo({top:0});
  },

  async excluir(colecao, cid){
    const filhos = colecao==='produtores'
      ? 'Os talhões, análises e visitas ligados a ele também serão apagados.'
      : colecao==='talhoes' ? 'As análises e visitas deste talhão também serão apagadas.' : '';
    if(!await perguntar('Excluir este registro? '+filhos+' Não dá para desfazer.')) return;
    S[colecao] = S[colecao].filter(x=>x.id!==cid);
    if(colecao==='produtores'){ const ts=S.talhoes.filter(t=>t.produtorId===cid).map(t=>t.id);
      S.talhoes=S.talhoes.filter(t=>t.produtorId!==cid);
      S.analises=S.analises.filter(a=>!ts.includes(a.talhaoId));
      S.visitas=S.visitas.filter(v=>!ts.includes(v.talhaoId)); }
    if(colecao==='talhoes'){ S.analises=S.analises.filter(a=>a.talhaoId!==cid); S.visitas=S.visitas.filter(v=>v.talhaoId!==cid); }
    await salvar(); render(); toast('Registro excluído');
  },

  async salvarConsultor(){
    const v = k => document.getElementById(k).value.trim();
    S.consultor = {nome:v('c_nome'),crea:v('c_crea'),fone:v('c_fone'),email:v('c_email'),empresa:v('c_empresa')};
    await salvar(); render(); toast('Dados do consultor salvos');
  },

  async setCult(k,campo,val){ S.tab.culturas[k][campo] = n(val); await salvar(); toast('Tabela atualizada'); },
  async setCultArr(k,campo,val){
    const arr = val.split(',').map(x=>n(x));
    if(arr.length!==5) return toast('Informe 5 valores separados por vírgula');
    S.tab.culturas[k][campo] = arr; await salvar(); toast('Tabela atualizada');
  },
  async restaurarTabelas(){
    if(!await perguntar('Restaurar todas as tabelas de referência para o padrão? Suas calibrações serão perdidas.','Restaurar')) return;
    S.tab = JSON.parse(JSON.stringify(PADRAO)); await salvar(); render(); toast('Tabelas restauradas');
  },

  async exportar(){
    await baixarArquivo('agrotech-backup-'+hoje()+'.json', JSON.stringify(S,null,2), 'application/json');
    toast('Backup gerado');
  },
  importar(){
    const i = document.createElement('input'); i.type='file'; i.accept='application/json';
    i.onchange = async e => {
      const arq = e.target.files[0]; if(!arq) return;
      try{
        const d = JSON.parse(await arq.text());
        if(!d.produtores) throw new Error('formato');
        S = Object.assign(vazio(), d);
        await salvar(); render(); toast('Backup importado');
      }catch(err){ toast('Arquivo inválido – esperava um backup do AgroTech'); }
    };
    i.click();
  }
};
window.app = app;

document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  const c = document.getElementById('confirmar');
  if(c){ c.remove(); return; }
  if(document.querySelector('.fundo')) app.fecharModal();
});

# Configuração local do Supabase CLI. O projeto de produção é linkado por
# `supabase link --project-ref $SUPABASE_PROJECT_REF` (ver .github/workflows).

project_id = "agrotech"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public", "agro"]
extra_search_path = ["public", "extensions", "agro"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/produtor/aceitar"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[edge_runtime]
enabled = true

[analytics]
enabled = false
